apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  serviceAccountName: pipeline
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/Alikhan808/tax-calculator-devops.git
    - name: branch
      value: main
    - name: app-name
      value: tax-calculator
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: dockerconfig-ws
      secret:
        secretName: docker-reg-creds
  timeouts:
    pipeline: 30m0s
